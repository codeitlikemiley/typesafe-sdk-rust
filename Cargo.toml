[package]
name = "typesafe-sdk"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Rust SDK for the TypeSafe AI API"
readme = "README.md"
repository = "https://github.com/codeitlikemiley/typesafe-sdk-rust"
keywords = ["typesafe", "sdk", "api", "ai"]
categories = ["api-bindings", "asynchronous"]
authors = ["Uriah Galang <codeitlikemiley@gmail.com>"]
exclude = [".github/"]

[[example]]
name = "blocking_triage"
required-features = ["blocking"]

[features]
default = []
blocking = ["tokio/rt", "tokio/net"]
mock = ["dep:wiremock"]

[dependencies]
bytes = "1"
encoding_rs = "=0.8.35"
fastrand = "2"
http = "0.2"
httpdate = "1"
idna = "=1.0.3"
idna_adapter = "=1.1.0"
indexmap = { version = "=2.7.1", features = ["serde"] }
log = "0.4"
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "=1.0.134", features = ["preserve_order"] }
tokio = { version = "1", default-features = false, features = ["time"] }
url = "=2.5.4"
wiremock = { version = "=0.5.22", optional = true }

[dev-dependencies]
serde_json = { version = "=1.0.134", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "=0.5.22"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

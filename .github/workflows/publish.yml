name: publish

on:
  push:
    tags:
      - "v*"
    # Agent / API workaround when git tag push is unavailable:
    # create branch tags/vX.Y.Z to trigger the same publish path.
    branches:
      - "tags/v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches package version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          # GITHUB_REF_NAME is v0.1.0 for tags, or tags/v0.1.0 for the branch workaround
          ref="${GITHUB_REF_NAME#tags/}"
          test "v$version" = "$ref"

      - name: Check formatting
        run: cargo fmt --check

      - name: Test
        run: cargo test

      - name: Test with blocking feature
        run: cargo test --features blocking

      - name: Check documentation
        run: RUSTDOCFLAGS='-D missing-docs' cargo doc --no-deps --all-features

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

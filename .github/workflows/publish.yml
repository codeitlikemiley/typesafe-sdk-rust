name: publish

on:
  push:
    tags:
      - "v*"
    # Agent / API workaround when git tag push is unavailable:
    # create branch tags/vX.Y.Z to trigger the same publish path.
    branches:
      - "tags/v*"
  workflow_dispatch:
    inputs:
      skip_crates_publish:
        description: "Create GitHub Release only (skip crates.io upload)"
        type: boolean
        default: false
      tag:
        description: "Release tag (e.g. v0.1.0). Defaults from Cargo.toml when empty."
        type: string
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve release tag
        id: release
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="v${version}"
          else
            tag="${GITHUB_REF_NAME#tags/}"
          fi
          test "v${version}" = "${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crates_publish != 'true'
        run: cargo fmt --all --check

      - name: Cargo check
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crates_publish != 'true'
        run: |
          cargo check --features mock
          cargo check --features "mock blocking"

      - name: Clippy
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crates_publish != 'true'
        run: |
          rustup component add clippy
          cargo clippy --all-targets --features mock -- -D warnings
          cargo clippy --all-targets --features "mock blocking" -- -D warnings

      - name: Test
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crates_publish != 'true'
        run: cargo test --features mock

      - name: Test with blocking feature
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crates_publish != 'true'
        run: cargo test --features "mock blocking"

      - name: Build examples
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crates_publish != 'true'
        run: |
          cargo build --examples --features mock
          cargo build --example blocking_triage --features "mock blocking"

      - name: Check documentation
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crates_publish != 'true'
        run: RUSTDOCFLAGS='-D missing-docs' cargo doc --no-deps --all-features

      - name: Publish to crates.io
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crates_publish != 'true'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: typesafe-sdk ${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            ## Install

            ```toml
            typesafe-sdk = "${{ steps.release.outputs.version }}"
            ```

            - [crates.io](https://crates.io/crates/typesafe-sdk/${{ steps.release.outputs.version }})
            - [docs.rs](https://docs.rs/typesafe-sdk/${{ steps.release.outputs.version }})

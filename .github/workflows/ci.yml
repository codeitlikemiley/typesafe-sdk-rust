name: ci

on:
  push:
    branches: [main, "gol/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all --check

  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --features mock
      - run: cargo check --features "mock blocking"
      - run: cargo check --features "mock blocking clef openai-decisions"

  wasm:
    name: wasm32-wasip2 (no reqwest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy
      - run: cargo clippy --lib --target wasm32-wasip2 --no-default-features -- -D warnings
      - run: cargo clippy --lib --target wasm32-wasip2 --no-default-features --features "clef openai-decisions" -- -D warnings

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --features mock -- -D warnings
      - run: cargo clippy --all-targets --features "mock blocking" -- -D warnings
      - run: cargo clippy --all-targets --features "mock blocking clef openai-decisions" -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features "mock blocking" -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --features mock
      - run: cargo test --features "mock blocking"
      - run: cargo test --no-default-features --features "mock blocking"
      - run: cargo test --features "mock blocking clef openai-decisions"

  examples:
    name: build examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --examples --features mock
      - run: cargo build --example blocking_triage --features "mock blocking"
      - run: cargo build --examples --features "mock clef openai-decisions"
